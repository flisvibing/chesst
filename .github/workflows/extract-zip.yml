name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o chesst-new-version.zip -d extracted

          # ZIP içinde tek bir ana klasör varsa içeriğini köke al
          if [ "$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l )" = "1" ]; then
            inner_dir="$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            cp -r "$inner_dir"/. .
          else
            cp -r extracted/. .
          fi

          rm -rf extracted
          

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Extract project source"
          git push
