<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Chesst</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="nav"></div>
    <main class="auth-wrap">
      <div class="card auth-card">
        <h1>Create your account</h1>
        <p class="sub">Free forever. Real Stockfish analysis, no mock data.</p>
        <div id="alert"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input class="input" id="username" type="text" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+" autocomplete="username">
            <div class="hint">3–24 characters: letters, numbers, underscores.</div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input class="input" id="password" type="password" required minlength="6" autocomplete="new-password">
            <div class="hint">At least 6 characters.</div>
          </div>
          <div class="form-group">
            <label for="confirm">Confirm password</label>
            <input class="input" id="confirm" type="password" required minlength="6" autocomplete="new-password">
          </div>
          <button class="btn btn-primary" id="submit" style="width:100%;">Create account</button>
        </form>
        <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
  <script type="module" src="js/register.js"></script>
</body>
</html>
