<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Openings — Chesst</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div id="nav"></div>
    <main class="container">
      <h1 style="font-size:22px; margin-bottom:4px;">Opening explorer</h1>
      <p style="color:var(--fg-soft); margin-bottom:12px;">Browse the ECO database, study main lines, and check win rates.</p>
      <div class="filter-bar">
        <input class="input" id="search" placeholder="Search openings (e.g. Sicilian, C20, Ruy Lopez)…">
      </div>
      <div class="volume-tabs" id="volume-tabs"></div>
      <div class="openings-layout">
        <div class="opening-list" id="opening-list">
          <div class="center-load"><span class="spinner"></span> Loading…</div>
        </div>
        <div id="opening-detail">
          <div class="card" style="text-align:center; color:var(--fg-soft);">
            Select an opening to see its moves and statistics.
          </div>
        </div>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
  <script type="module" src="js/openings.js"></script>
</body>
</html>
